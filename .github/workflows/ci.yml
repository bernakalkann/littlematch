name: LittleMatch kalite kontrolü

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  kalite:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bağımlılıkları kur
        run: npm install

      - name: Lint kontrolü
        run: npm run lint

      - name: TypeScript kontrolü
        run: npm run typecheck

      - name: Production build
        run: npm run build
